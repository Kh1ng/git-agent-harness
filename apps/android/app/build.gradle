plugins { id 'com.android.application' }

android {
    namespace 'com.kh1ng.gah'
    compileSdk 35
    defaultConfig {
        applicationId 'com.kh1ng.gah'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
