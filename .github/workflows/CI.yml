name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Issue: ~1.4GB of accidentally-committed target/ build artifacts sat in
  # this repo's git history for months before being discovered (.gitignore
  # already covered target/ by the time this was noticed -- the commits
  # predated that, or bypassed it via `git add -f`). Rewriting history to
  # remove it was explicitly ruled out as a fix; this is the actual fix:
  # catch the next one before it merges, not after.
  guard-no-build-artifacts:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if this PR adds build-artifact-looking paths or oversized files
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          bad=0
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              target/*|*/target/*|node_modules/*|*/node_modules/*|*.rlib)
                echo "::error file=$path::looks like a build artifact -- should already be gitignored, do not force-add it"
                bad=1
                ;;
            esac
            size=$(git cat-file -s "$head:$path" 2>/dev/null || echo 0)
            if [ "$size" -gt 5242880 ]; then
              mb=$((size / 1048576))
              echo "::error file=$path::added file is ${mb}MB -- suspiciously large for a source repo, double check this is intentional"
              bad=1
            fi
          done <<< "$(git diff --name-status --diff-filter=A "$base" "$head" | cut -f2)"
          exit "$bad"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Source-size ratchets compare a PR with its base branch so a
          # baseline increase cannot disguise source growth.
          fetch-depth: 0

      - name: Compute changed files and Rust scope
        id: rust-test-scope
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi

          if [ -z "${base}" ] || [ "${base}" = "0000000000000000000000000000000000000000" ]; then
            base="$head~1"
          fi

          changed_files="$(git diff --name-only "$base" "$head")"

          has_rust_changes=false
          has_desktop_changes=false
          rust_test_scope="scoped"
          declare -A scoped_targets

          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              Cargo.toml|Cargo.lock|tests/*)
                # A dependency bump or a shared integration-test change can
                # affect any module -- module-scoped filtering can't safely
                # narrow these, so force a full run.
                has_rust_changes=true
                rust_test_scope="full"
                ;;
              src/*.rs)
                has_rust_changes=true
                rust_test_scope="full"
                ;;
              src/*/*)
                has_rust_changes=true
                module="${path#src/}"
                module="${module%%/*}"
                scoped_targets["$module"]=1
                ;;
              apps/desktop/*|apps/desktop/*/*)
                has_desktop_changes=true
                has_rust_changes=true
                ;;
            esac
          done <<< "$changed_files"

          if [ "$rust_test_scope" = "scoped" ]; then
            readarray -t sorted_targets < <(printf '%s\n' "${!scoped_targets[@]}" | sort -u)
            if [ "${#sorted_targets[@]}" -eq 0 ]; then
              rust_test_scope="full"
            else
              rust_test_filters="$(printf '%s ' "${sorted_targets[@]}")"
              rust_test_filters="${rust_test_filters% }"
            fi
          fi

          echo "has_rust_changes=${has_rust_changes}" >> "$GITHUB_OUTPUT"
          echo "has_desktop_changes=${has_desktop_changes}" >> "$GITHUB_OUTPUT"
          echo "rust_test_scope=${rust_test_scope}" >> "$GITHUB_OUTPUT"
          echo "rust_test_filters=${rust_test_filters:-}" >> "$GITHUB_OUTPUT"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build:web

      - name: Install Tauri Linux dependencies
        if: steps.rust-test-scope.outputs.has_desktop_changes == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        if: steps.rust-test-scope.outputs.has_rust_changes == 'true'
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo test
        if: steps.rust-test-scope.outputs.has_rust_changes == 'true'
        run: |
          if [ "${{ steps.rust-test-scope.outputs.rust_test_scope }}" = "full" ]; then
            cargo test
          else
            for scope in ${{ steps.rust-test-scope.outputs.rust_test_filters }}; do
              cargo test "$scope"
            done
            # The module-name substring filter above only ever matches unit
            # tests (whose fully-qualified names embed the module path). The
            # root-level tests/*.rs integration suite exercises modules
            # without a matching name, so a scoped run would otherwise skip
            # it entirely -- run it unfiltered every time, scoped or not.
            cargo test --tests
          fi

      - name: cargo clippy
        if: steps.rust-test-scope.outputs.has_rust_changes == 'true'
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Check desktop application
        if: steps.rust-test-scope.outputs.has_desktop_changes == 'true'
        run: |
          mkdir -p apps/desktop/dist
          cargo check --manifest-path apps/desktop/Cargo.toml
