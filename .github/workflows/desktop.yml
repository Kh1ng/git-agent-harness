# Native desktop builds also gate pull requests that change the app or its installer.
name: Desktop

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/desktop.yml'
      - 'apps/desktop/**'
      - 'apps/server/src/nodeSetup*'
      - 'apps/server/src/authMiddleware.ts'
      - 'scripts/install-windows.ps1'
      - 'scripts/install-wsl-worker.sh'
      - 'scripts/test-windows-installer.ps1'
      - 'scripts/test-wsl-worker-config.py'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
  push:
    tags:
      - 'desktop-*'

permissions:
  contents: read

jobs:
  windows:
    name: Windows installer (NSIS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust (stable MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: npm run build:contracts && npm run build:shared

      - name: Check desktop types
        run: npm run --workspace=apps/desktop typecheck

      - name: Check Windows installer contracts
        run: powershell -NoProfile -File scripts/test-windows-installer.ps1

      - name: Build local connection screen
        working-directory: apps/desktop
        run: npx vite build

      - name: Generate icons
        working-directory: apps/desktop
        run: npx tauri icon icons/icon.png

      - name: Test desktop settings and URL validation
        working-directory: apps/desktop
        run: cargo test -- --test-threads=1

      - name: Build the Windows installer
        working-directory: apps/desktop
        run: npx tauri build --bundles nsis

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: gah-worker-windows-nsis
          path: apps/desktop/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  macos:
    name: macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: npm run build:contracts && npm run build:shared

      - name: Check desktop types
        run: npm run --workspace=apps/desktop typecheck

      - name: Check WSL worker configuration
        run: |
          bash -n scripts/install-wsl-worker.sh
          python3 scripts/test-wsl-worker-config.py

      - name: Build local connection screen
        working-directory: apps/desktop
        run: npx vite build

      - name: Test desktop settings and URL validation
        working-directory: apps/desktop
        run: cargo test -- --test-threads=1

      - name: Build the macOS app
        working-directory: apps/desktop
        run: npx tauri build --bundles app

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: gah-worker-macos-app
          path: apps/desktop/target/release/bundle/macos/*.app
          if-no-files-found: error
