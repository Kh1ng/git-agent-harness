name: Release — Windows

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or tag to build from
        default: main
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Windows NSIS installer
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust (stable MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: npm run build:contracts && npm run build:shared

      - name: Build frontendDist stub
        working-directory: apps/desktop
        run: npx vite build

      - name: Build installer
        working-directory: apps/desktop
        run: npx tauri build --bundles nsis

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: gah-worker-windows-nsis
          path: apps/desktop/target/release/bundle/nsis/*.exe
          if-no-files-found: error
